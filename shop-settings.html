<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Settings • KhataPro</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand mini" href="dashboard.html"><span class="brandmark">K</span><span>KhataPro</span></a><div class="top-right"><select id="languageSelect" class="lang"><option value="en">EN</option><option value="ne">ने</option></select><a class="ghost" href="dashboard.html" data-i18n="dashboard">Dashboard</a></div></header><main class="formwrap"><section class="panel"><p class="eyebrow" data-i18n="settings">Shop Settings</p><h1 data-i18n="shopSettings">Shop Settings</h1><form id="shopForm" class="formgrid"><label><span data-i18n="shopName">Shop name</span><input id="shopName" required></label><label><span data-i18n="ownerName">Owner name</span><input id="ownerName"></label><label><span data-i18n="shopMobile">Shop mobile</span><input id="shopMobile"></label><label><span data-i18n="taxNo">GST / VAT number</span><input id="taxNo"></label><label class="full"><span data-i18n="address">Address</span><input id="address"></label><label class="full photo-upload"><span data-i18n="shopPhoto">Shop photo</span><input id="shopPhoto" type="file" accept="image/*"><small class="hint" data-i18n="uploadShopPhoto">Optional shop photo. It will be compressed for faster loading.</small><div class="photo-preview-wrap"><img id="shopPhotoPreview" class="photo-preview hidden" alt="Shop photo"><button id="removeShopPhoto" type="button" class="ghost small-action" data-i18n="removePhoto">Remove photo</button></div></label><label class="check full"><input id="allowView" type="checkbox"><span><b data-i18n="allowPortal">Enable customer portal</b><small class="hint">Mobile + private PIN is required. Mobile number alone never reveals account data.</small></span></label><button class="primary full" type="submit" data-i18n="saveShop">Save Shop Details</button><p id="msg" class="msg full"></p></form></section></main><nav class="mobile-nav"><a href="dashboard.html"><span>⌂</span><span data-i18n="home">Home</span></a><a href="customers.html"><span>👥</span><span data-i18n="customers">Customers</span></a><a href="add-customer.html"><span>＋</span><span data-i18n="addCustomer">Add</span></a><a href="reports.html"><span>▦</span><span data-i18n="reports">Reports</span></a><a href="shop-settings.html"><span>⚙</span><span data-i18n="settings">Settings</span></a></nav><script type="module" src="js/settings.js"></script></body></html>
