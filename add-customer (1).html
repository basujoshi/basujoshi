<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Customer • KhataPro</title><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand mini" href="dashboard.html"><span class="brandmark">K</span><span>KhataPro</span></a><div class="top-right"><select id="languageSelect" class="lang"><option value="en">EN</option><option value="ne">ने</option></select><a class="ghost" href="customers.html" data-i18n="customers">Customers</a></div></header><main class="formwrap"><section class="panel"><p class="eyebrow" data-i18n="newCustomer">New Customer</p><h1 data-i18n="createLedger">Create Customer Ledger</h1><form id="customerForm" class="formgrid"><label><span data-i18n="name">Customer name</span><input id="name" required></label><label><span data-i18n="mobile">Mobile number</span><input id="mobile" required inputmode="tel"></label><label><span data-i18n="address">Address</span><input id="address"></label><label><span data-i18n="email">Email address</span><input id="email" type="email"></label><label class="full"><span data-i18n="notes">Notes</span><textarea id="notes"></textarea></label><label class="check full"><input id="online" type="checkbox" checked><span><b data-i18n="onlineAccess">Allow customer portal access</b><small class="hint" data-i18n="onlineHint">Customer can view this shop after entering their mobile number and private 6-digit PIN.</small></span></label><button class="primary full" type="submit" data-i18n="createLedger">Create Customer Ledger</button><p id="msg" class="msg full"></p></form><div id="pinBox" class="pin-box hidden"><b data-i18n="privatePin">Private PIN</b><div id="pinCode" class="pin-code">000000</div><p class="hint" data-i18n="pinHint">Show this PIN to the customer privately.</p><button class="secondary" id="copyPin" type="button" data-i18n="copy">Copy PIN</button> <a class="primary btn" id="openCustomer" href="#" data-i18n="account">My Account</a></div></section></main><script type="module" src="js/add-customer.js"></script></body></html>
